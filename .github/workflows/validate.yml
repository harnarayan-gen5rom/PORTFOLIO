name: Validate 3D website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          node --check scene.js
          node --check rift.js
      - name: Verify both full-screen sections and all assets
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert/strict');
          const html = fs.readFileSync('index.html','utf8');
          for (const id of ['experience','sceneCanvas','rift','riftCanvas','riftGalleryUi','riftModal','riftEnter','riftBack','videoModal']) {
            assert.ok(html.includes('id="'+id+'"'), 'Missing required element: '+id);
          }
          for (const filename of ['style.css','script.js','scene.js','rift.css','rift.js']) {
            assert.ok(fs.statSync(filename).size > 100, 'Missing/empty file: '+filename);
            assert.ok(html.includes(filename), 'Asset not referenced: '+filename);
          }
          const scenes=fs.readFileSync('rift.js','utf8');
          assert.match(scenes,/new THREE.ExtrudeGeometry/,'Mechanical blades missing');
          assert.match(scenes,/new THREE.ShaderMaterial/,'Energy shader missing');
          assert.match(scenes,/spring\(p,amount,dt\)/,'Proximity spring missing');
          assert.match(scenes,/buildGallery\(\)/,'Project gallery missing');
          console.log('All static website checks passed.');
          NODE
  browser-smoke:
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test harness
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Test both fullscreen interactions in Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/portfolio-local.log 2>&1 &
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright-core');
          const fs=require('fs');
          (async()=>{
            const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(p=>fs.existsSync(p));
            if(!executablePath) throw Error('No Chromium-based browser installed on runner');
            const browser=await chromium.launch({
              executablePath,headless:true,
              args:['--no-sandbox','--disable-webgl','--disable-software-rasterizer']
            });
            const errors=[];
            try{
              const desktop=await browser.newPage({viewport:{width:1440,height:900}});
              desktop.on('pageerror',e=>errors.push('Desktop: '+e.message));
              await desktop.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
              await desktop.locator('#heroTitle').waitFor({state:'visible'});
              await desktop.locator('#rift').scrollIntoViewIfNeeded();
              await desktop.locator('#riftEnter').waitFor({state:'visible'});
              await desktop.waitForTimeout(1600);
              console.log('Fallback UI active (expected in this smoke test):',!(await desktop.locator('#riftStage').evaluate(el=>el.classList.contains('ready'))));
              await desktop.screenshot({path:'rift-desktop.png',fullPage:false});
              await desktop.locator('#riftEnter').click();
              await desktop.waitForTimeout(3200);
              const diagnostic=await desktop.evaluate(()=>({
                riftState:document.querySelector('#riftState')?.textContent,
                buttonText:document.querySelector('#riftEnter')?.textContent,
                disabled:document.querySelector('#riftEnter')?.disabled,
                galleryHidden:document.querySelector('#riftGalleryUi')?.hidden,
                stageReady:document.querySelector('#riftStage')?.classList.contains('ready'),
                scrollY:window.scrollY,
                rect:document.querySelector('#rift')?.getBoundingClientRect().top
              }));
              console.log('RIFT DIAGNOSTIC',JSON.stringify(diagnostic),'BROWSER ERRORS',JSON.stringify(errors));
              await desktop.locator('#riftGalleryUi').waitFor({state:'visible',timeout:6000});
              await desktop.locator('#riftProjectNav [data-project="0"]').click();
              await desktop.locator('#riftModal').waitFor({state:'visible'});
              await desktop.locator('#riftModalClose').click();
              await desktop.locator('#riftModal').waitFor({state:'hidden'});
              await desktop.locator('#riftBack').click();
              const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              mobile.on('pageerror',e=>errors.push('Mobile: '+e.message));
              await mobile.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
              await mobile.locator('#heroTitle').waitFor({state:'visible'});
              await mobile.locator('#rift').scrollIntoViewIfNeeded();
              await mobile.waitForTimeout(1400);
              await mobile.screenshot({path:'rift-mobile.png',fullPage:false});
              await mobile.locator('#riftEnter').click();
              await mobile.locator('#riftGalleryUi').waitFor({state:'visible',timeout:18000});
              await mobile.locator('#riftProjectNav [data-project="1"]').click();
              await mobile.locator('#riftModalClose').waitFor({state:'visible'});
              await mobile.locator('#riftModalClose').click();
              if(errors.length)throw Error('JavaScript runtime errors:\n'+errors.join('\n'));
              console.log('Desktop and mobile navigation/gallery/modal browser smoke checks passed');
            }finally{await browser.close();}
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE
      - name: Save desktop/mobile render previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rift-render-smoke
          path: |
            rift-desktop.png
            rift-mobile.png
          if-no-files-found: ignore
